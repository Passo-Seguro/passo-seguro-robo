[project]
name = "passo-seguro-robo"
version = "0.1.0"
description = "Robo Inspetor de Acessibilidade - Project-Based Maker Lab"
authors = [
    {name = "Passo Seguro"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserial (>=3.5,<4.0)"
]

[tool.poetry]
packages = [{include = "carrinho", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
